# Single-node Garage for the Coolify stack. Same as docker/garage/garage.toml,
# except the RPC secret is read from a file that the garage-secret service
# generates on first deploy. The admin token comes from GARAGE_ADMIN_TOKEN.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
block_size = 1048576

replication_mode = "none"

rpc_bind_addr = "[::]:3901"
rpc_secret_file = "/run/garage-secrets/rpc_secret"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
