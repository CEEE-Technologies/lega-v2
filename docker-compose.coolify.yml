# LEGA production stack for Coolify (Docker Compose build pack).
#
# Differences from docker-compose.prod.yml:
#   - server, webapp and migrations are built from this repository, not pulled
#     from the upstream bigcapitalhq images
#   - no published ports: Coolify's proxy sends the domain to the `proxy` service
#     on port 80 and handles HTTPS
#   - passwords and secrets are generated by Coolify (SERVICE_PASSWORD_* variables)
#   - Garage sets up its key and bucket on its own (garage-secret, garage-init)
#   - a `backup` service dumps every database and the uploaded files each night
#   - no Watchtower (Coolify redeploys) and no ClickHouse (disabled by default)
#
# In Coolify: set the domain on the `proxy` service only, and set BASE_URL to it.

services:
  proxy:
    build:
      context: ./docker
      dockerfile: coolify/envoy/Dockerfile
    depends_on:
      - server
      - webapp
    restart: unless-stopped

  webapp:
    build:
      context: ./
      dockerfile: packages/webapp/Dockerfile
    restart: unless-stopped

  server:
    build:
      context: ./
      dockerfile: packages/server/Dockerfile
    # Loads the S3 key written by garage-init, then starts the API.
    command:
      - sh
      - -c
      - set -a && . /run/lega-s3/s3.env && set +a && exec node packages/server/dist/main.js
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - lega-s3-credentials:/run/lega-s3:ro
    environment:
      # Application
      - BASE_URL=${BASE_URL}
      - APP_JWT_SECRET=${SERVICE_PASSWORD_64_JWT}

      # Database
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-lega}
      - DB_PASSWORD=${SERVICE_PASSWORD_DB}
      - DB_CHARSET=${DB_CHARSET:-utf8}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME:-bigcapital_system}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_HOST=redis
      - QUEUE_PORT=6379

      # ClickHouse analytics store (not part of this stack)
      - CLICKHOUSE_ENABLED=false

      # File storage (Garage). The key comes from /run/lega-s3/s3.env.
      - S3_REGION=garage
      - S3_ENDPOINT=http://garage:3900
      - S3_BUCKET=${S3_BUCKET:-lega}
      - S3_FORCE_PATH_STYLE=true

      # PDF generation
      - GOTENBERG_URL=http://gotenberg:3000
      - GOTENBERG_DOCS_URL=http://server:3000/public/

      # Mail
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}

      # Sign-up
      - SIGNUP_DISABLED=${SIGNUP_DISABLED:-false}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS}
      - SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS}
      - SIGNUP_EMAIL_CONFIRMATION=${SIGNUP_EMAIL_CONFIRMATION:-false}

      # Exchange rates
      - EXCHANGE_RATE_SERVICE=${EXCHANGE_RATE_SERVICE:-open-exchange-rate}
      - OPEN_EXCHANGE_RATE_APP_ID=${OPEN_EXCHANGE_RATE_APP_ID}

      # Bank feeds (Plaid)
      - BANK_FEED_ENABLED=${BANK_FEED_ENABLED:-false}
      - PLAID_ENV=${PLAID_ENV:-sandbox}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      - PLAID_LINK_WEBHOOK=${PLAID_LINK_WEBHOOK}
      - PLAID_CLIENT_NAME=${PLAID_CLIENT_NAME}

      # Stripe
      - STRIPE_PAYMENT_SECRET_KEY=${STRIPE_PAYMENT_SECRET_KEY}
      - STRIPE_PAYMENT_PUBLISHABLE_KEY=${STRIPE_PAYMENT_PUBLISHABLE_KEY}
      - STRIPE_PAYMENT_CLIENT_ID=${STRIPE_PAYMENT_CLIENT_ID}
      - STRIPE_PAYMENT_WEBHOOKS_SECRET=${STRIPE_PAYMENT_WEBHOOKS_SECRET}
      - STRIPE_PAYMENT_REDIRECT_URL=${STRIPE_PAYMENT_REDIRECT_URL}

      # API rate limiting
      - THROTTLE_GLOBAL_TTL=${THROTTLE_GLOBAL_TTL:-60000}
      - THROTTLE_GLOBAL_LIMIT=${THROTTLE_GLOBAL_LIMIT:-300}
      - THROTTLE_AUTH_TTL=${THROTTLE_AUTH_TTL:-60000}
      - THROTTLE_AUTH_LIMIT=${THROTTLE_AUTH_LIMIT:-30}

  # Runs the system and tenant migrations with this repo's code, then exits.
  migration:
    build:
      context: ./
      dockerfile: packages/server/Dockerfile
    working_dir: /app/packages/server
    command:
      - sh
      - -c
      - node dist/cli.js system:migrate:latest && node dist/cli.js tenants:migrate:latest
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'
    exclude_from_hc: true
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-lega}
      - DB_PASSWORD=${SERVICE_PASSWORD_DB}
      - DB_CHARSET=${DB_CHARSET:-utf8}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME:-bigcapital_system}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX:-bigcapital_tenant_}
      - APP_JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_HOST=redis
      - QUEUE_PORT=6379

  mysql:
    build:
      context: ./docker/mariadb
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME:-bigcapital_system}
      - MYSQL_USER=${DB_USER:-lega}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_DB}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_DBROOT}
    volumes:
      - lega-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root --password="$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    build:
      context: ./docker/redis
    restart: unless-stopped
    volumes:
      - lega-redis:/data

  gotenberg:
    image: gotenberg/gotenberg:7
    restart: unless-stopped

  # Creates Garage's RPC secret on first deploy and keeps it afterwards.
  garage-secret:
    image: alpine:3.20
    command:
      - sh
      - -c
      - '[ -s /run/garage-secrets/rpc_secret ] || head -c 32 /dev/urandom | od -An -tx1 | tr -d " \n" > /run/garage-secrets/rpc_secret; chmod 600 /run/garage-secrets/rpc_secret'
    volumes:
      - lega-garage-secrets:/run/garage-secrets
    restart: 'no'
    exclude_from_hc: true

  garage:
    build:
      context: ./docker/coolify/garage
    depends_on:
      garage-secret:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      - GARAGE_ADMIN_TOKEN=${SERVICE_PASSWORD_GARAGEADMIN}
    volumes:
      - lega-garage-secrets:/run/garage-secrets:ro
      - lega-garage:/var/lib/garage

  # Sets up Garage's layout, access key and bucket, then exits.
  garage-init:
    build:
      context: ./docker/coolify/garage
      dockerfile: Dockerfile.init
    depends_on:
      - garage
    restart: 'no'
    exclude_from_hc: true
    environment:
      - GARAGE_ADMIN_TOKEN=${SERVICE_PASSWORD_GARAGEADMIN}
      - S3_BUCKET=${S3_BUCKET:-lega}
    volumes:
      - lega-s3-credentials:/run/lega-s3

  # Daily backups of all databases and uploaded files (docker/coolify/backup).
  backup:
    build:
      context: ./docker/coolify/backup
    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-lega}
      - DB_PASSWORD=${SERVICE_PASSWORD_DB}
      - BACKUP_HOUR_UTC=${BACKUP_HOUR_UTC:-2}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
      # Off-site copy: set these to upload each backup to S3 / R2 / B2.
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}
      - BACKUP_S3_PATH=${BACKUP_S3_PATH:-lega}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-auto}
      - BACKUP_S3_PROVIDER=${BACKUP_S3_PROVIDER:-Other}
      - BACKUP_S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID}
      - BACKUP_S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY}
    volumes:
      - lega-backups:/backups
      - lega-garage:/garage-data:ro

volumes:
  lega-mysql:
  lega-redis:
  lega-garage:
  lega-garage-secrets:
  lega-s3-credentials:
  lega-backups:
